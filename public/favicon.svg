<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Факт">
  <!-- Нейтральный знак: сводная таблица — шапка и три строки данных.
       Фирменной графики нет; в тёмной теме плоскость и штрихи меняются местами. -->
  <style>
    .plate { fill: #18181b; }
    .mark { fill: #fafafa; }
    .accent { fill: #818cf8; }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #e4e4e7; }
      .mark { fill: #18181b; }
      .accent { fill: #4f46e5; }
    }
  </style>
  <rect class="plate" width="64" height="64" rx="14" />
  <rect class="accent" x="14" y="17" width="36" height="6" rx="3" />
  <rect class="mark" x="14" y="29" width="22" height="5" rx="2.5" />
  <rect class="mark" x="40" y="29" width="10" height="5" rx="2.5" />
  <rect class="mark" x="14" y="38" width="22" height="5" rx="2.5" />
  <rect class="mark" x="40" y="38" width="10" height="5" rx="2.5" />
  <rect class="mark" x="14" y="47" width="14" height="5" rx="2.5" />
  <rect class="accent" x="40" y="47" width="10" height="5" rx="2.5" />
</svg>
